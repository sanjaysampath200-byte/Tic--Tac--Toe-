<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
        h1 { margin-bottom: 10px; color: #333; }
        #status {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            color: #555;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px auto;
        }
        .cell {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 10px;
            background: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background: #ddd; }
        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }
        #reset {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #reset:hover { background: #5568d9; }
    </style>
</head>
<body>
    <div class="game">
        <h1>🎮 Tic Tac Toe</h1>
        <div id="status">Player X's Turn</div>

        <div class="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>
            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>
            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <button id="reset" onclick="resetGame()">🔄 Restart Game</button>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        const cells = document.querySelectorAll(".cell");
        const status = document.getElementById("status");

        const winningPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function makeMove(index) {
            if (board[index] !== "" || gameOver) return;

            board[index] = currentPlayer;
            cells[index].textContent = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            if (checkWinner()) {
                status.textContent = "🎉 Player " + currentPlayer + " Wins!";
                gameOver = true;
                return;
            }

            if (!board.includes("")) {
                status.textContent = "🤝 It's a Draw!";
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            status.textContent = "Player " + currentPlayer + "'s Turn";
        }

        function checkWinner() {
            for (let pattern of winningPatterns) {
                const [a, b, c] = pattern;
                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    return true;
                }
            }
            return false;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove("x", "o");
            });

            status.textContent = "Player X's Turn";
        }
    </script>
</body>
</html>
